<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Planet Map</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; touch-action:none; }
body { display:flex; align-items:center; justify-content:center;
       font-family:Arial,"Helvetica Neue",Helvetica,"Segoe UI",sans-serif; }
#stage { position:relative; width:100vw; height:100vh; overflow:hidden;
         display:flex; align-items:center; justify-content:center; }
#map {
  position:relative;
  width:min(100vw, calc(100vh * 1280 / 656));
  height:min(100vh, calc(100vw * 656 / 1280));
  aspect-ratio:1280/656; flex:none;
  transform-origin:0 0; will-change:transform;
  user-select:none; -webkit-user-select:none;
}
#map img { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
#overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }

/* ---- enemy troops shading ---- */
#shades path { display:none; }
#shades path.imp { display:block; fill:rgba(25,28,40,.30); }
#shades path.reb { display:block; fill:rgba(255,150,40,.30); }

/* ---- labels ---- */
#erase rect { fill:#fff; }
#labels .box   { fill:#fff; stroke:#000; stroke-width:1.6; rx:4; ry:4; }
#labels text {
  font-family:Arial,"Helvetica Neue",Helvetica,"Segoe UI",sans-serif;
  font-weight:700; font-size:18px; letter-spacing:.2px;
  text-anchor:middle; dominant-baseline:central; fill:#000;
}
#labels g.marked .box { fill:#ffe9e9; stroke:#c40000; stroke-width:2.4; }
#labels g.marked text { fill:#c40000; }

.cross { display:none; }
.cross.on { display:block; }
.cross line { stroke:#e40000; stroke-width:6; stroke-linecap:round; filter:drop-shadow(0 0 2px #fff); }

/* ---- planet tokens ---- */
.sym { stroke:#1b1b1b; stroke-width:1.3; }
.sym.B { fill:#3b4fd8; } .sym.Y { fill:#f29a1a; }
.num circle { fill:#1b1b1b; } .num text { fill:#fff; font-size:11px; font-weight:700;
  text-anchor:middle; dominant-baseline:central; }
.sab { display:none; } .sab.on { display:block; }
.sab rect { fill:#d32f2f; stroke:#5a0b0b; stroke-width:1.4; }
.sab circle { fill:none; stroke:#fff; stroke-width:1.6; }
.sab line { stroke:#fff; stroke-width:2; stroke-linecap:round; }
.hex > g { display:none; } .hex > g.on { display:block; }
/* ---- allegiance painted on the planet (optional style) ---- */
body.pstyle .hexWrap { display:none; }
body:not(.pstyle) #planets .crest { display:none; }   /* hexagon style: colour only, no emblem on the planet */
.pl .emb { fill:currentColor; }
.pl .ring { fill:none; stroke:currentColor; }
.pl.imp { color:#f4f4f4; } .pl.occ { color:#f4f4f4; } .pl.reb { color:#c62828; }
/* rebel planets white-blue (both styles), neutral planets white-grey */
#planets .pl.reb > circle.base { fill:url(#rebShadeBlue); stroke:#3d6e9e; }
.hex .pl.reb .def > polygon.base { fill:url(#rebShadeBlue); stroke:#3d6e9e; }
/* no production this turn (sabotage / enemy troops): soft glow on the rim */
.noprod { display:none; fill:none; stroke:#ff4d3a; stroke-width:2.6; opacity:.55;
          filter:drop-shadow(0 0 2.5px #ff4d3a) drop-shadow(0 0 1px #ff4d3a);
          animation:noprodPulse 2.4s ease-in-out infinite; }
.noprod.on { display:block; }
@keyframes noprodPulse { 0%,100% { opacity:.35; } 50% { opacity:.75; } }
@media (prefers-reduced-motion: reduce) { .noprod { animation:none; opacity:.6; } }
.ship { display:none; } .ship.on { display:block; }
.ship.imp path { fill:#262830; stroke:#e8e8e8; stroke-width:1.2; }
.shipImg { filter:drop-shadow(0 0 1.2px #000) drop-shadow(0 0 1.2px #000); }
.ship.reb path { fill:#fbf6ea; stroke:#6b3c0c; stroke-width:1.2; }

#menuButton {
  position:fixed; right:max(10px, env(safe-area-inset-right));
  top:max(10px, env(safe-area-inset-top));
  width:50px; height:50px; border:0; border-radius:12px; padding:0;
  background:rgba(25,25,25,.88); color:#fff;
  -webkit-appearance:none; appearance:none; font:inherit; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  z-index:20; box-shadow:0 2px 10px #0008;
}
#menuButton i { width:4px; height:4px; border-radius:50%; background:currentColor; }
#menu {
  position:fixed; right:max(10px, env(safe-area-inset-right));
  top:calc(max(10px, env(safe-area-inset-top)) + 58px);
  z-index:21; display:none; width:250px;
  max-height:calc(100vh - max(10px, env(safe-area-inset-top)) - 68px - env(safe-area-inset-bottom));
  max-height:calc(100dvh - max(10px, env(safe-area-inset-top)) - 68px - env(safe-area-inset-bottom));
  overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; touch-action:pan-y;
  background:#222; border-radius:12px; box-shadow:0 4px 20px #0009;
}
#menu.show { display:block; }
#menu button {
  display:block; touch-action:pan-y; width:100%; padding:16px; border:0; border-bottom:1px solid #444;
  background:#222; color:#fff; text-align:left; font-size:16px;
}
#menu button:last-child { border-bottom:0; }
#menu button#prodBtn { background:#2d3a1c; font-weight:700; }
#zoomBar {
  position:fixed; left:max(10px, env(safe-area-inset-left));
  top:max(10px, env(safe-area-inset-top)); z-index:20;
  display:flex; gap:8px;
}
#zoomBar button {
  width:46px; height:46px; border:0; border-radius:12px;
  background:rgba(25,25,25,.78); color:#fff; font-size:24px; line-height:1;
  box-shadow:0 2px 10px #0008;
}
#hint {
  position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:10; max-width:92vw; text-align:center;
  padding:8px 12px; border-radius:10px; color:#fff;
  background:rgba(0,0,0,.65); font-size:14px;
  opacity:1; transition:opacity .5s; pointer-events:none;
}
#hint.hide { opacity:0; }
/* ---- allegiance picker (alternative controls: long press on a planet) ---- */
#facPick { position:fixed; left:0; top:0; z-index:30; display:none; padding:6px; min-width:200px;
           background:#222; border-radius:12px; box-shadow:0 4px 20px #0009; }
#facPick.show { display:block; }
#fpTitle { color:#aaa; font-size:13px; font-weight:700; padding:4px 10px 6px; }
#fpBody button { display:flex; align-items:center; gap:12px; width:100%; padding:9px 12px; border:0;
                 border-radius:8px; background:transparent; color:#fff; font:inherit; font-size:16px; text-align:left; }
#fpBody button.cur { background:#3a3e45; font-weight:700; }
#fpBody svg { flex:none; }
#facPick .pl.reb > circle.base { fill:url(#rebShadeBlue); stroke:#3d6e9e; }

/* ---- production window ---- */
#prod { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
        background:rgba(0,0,0,.55); touch-action:pan-y; }
#prod.show { display:flex; }
#prodBox { position:relative; background:#1e2024; color:#eee; border-radius:14px;
           width:min(760px, 96vw); max-height:92vh; overflow:auto; padding:14px 16px 16px;
           box-shadow:0 8px 30px #000a; touch-action:pan-y; }
#prodBox h2 { margin:0 44px 10px 0; font-size:19px; }
#prodClose, #iconsClose, #setClose { position:absolute; top:8px; right:8px; width:40px; height:40px; border:0; border-radius:10px;
             background:#33363c; color:#fff; font-size:24px; line-height:1; }
.cols { display:flex; gap:14px; flex-wrap:wrap; }
.side { flex:1 1 320px; min-width:0; background:#26292e; border-radius:10px; padding:10px 10px 8px; }
.side h3 { margin:0 0 8px; font-size:16px; display:flex; align-items:center; gap:8px; }
.side.reb h3 { color:#ff8a70; } .side.imp h3 { color:#c9cfdc; }
.side table { width:100%; border-collapse:collapse; }
.side th, .side td { text-align:center; padding:5px 2px; }
.side th:first-child, .side td:first-child { text-align:left; white-space:nowrap; font-size:13px; color:#aaa; }
.side td.v { font-size:18px; font-weight:700; }
.side td.z { color:#555; font-weight:400; }
.side tr + tr td { border-top:1px solid #34373d; }
.src { font-size:12px; color:#999; margin:2px 0 0; line-height:1.35; }
.src b { color:#bbb; font-weight:600; }
.side td.src { white-space:normal; overflow-wrap:anywhere; text-align:left; font-size:11.5px; color:#999; }
#icons { position:fixed; inset:0; z-index:41; display:none; align-items:center; justify-content:center;
         background:rgba(0,0,0,.55); touch-action:pan-y; }
#icons.show { display:flex; }
#about { position:fixed; inset:0; z-index:42; display:none; align-items:center; justify-content:center;
         background:rgba(0,0,0,.55); touch-action:pan-y; }
#about.show { display:flex; }
#aboutBox { position:relative; background:#1e2024; color:#ddd; border-radius:14px; width:min(560px,96vw);
            max-height:92vh; overflow:auto; padding:14px 18px 16px; box-shadow:0 8px 30px #000a;
            touch-action:pan-y; font-size:14px; line-height:1.45; }
#aboutBox h2 { margin:0 44px 2px 0; font-size:19px; color:#fff; }
#aboutBox h3 { margin:14px 0 4px; font-size:15px; color:#fff; }
#aboutBox p { margin:6px 0; }
#aboutBox ul { margin:4px 0; padding-left:20px; }
#aboutBox li { margin:3px 0; }
#aboutBox .ver { color:#888; font-size:12px; margin-bottom:8px; }
#aboutBox .fine { color:#888; font-size:12px; margin-top:12px; }
#aboutClose { position:absolute; top:8px; right:8px; width:40px; height:40px; border:0; border-radius:10px;
              background:#33363c; color:#fff; font-size:24px; line-height:1; }
#iconsBox { position:relative; background:#1e2024; color:#eee; border-radius:14px; width:min(520px,96vw);
            max-height:92vh; overflow:auto; padding:14px 16px 12px; box-shadow:0 8px 30px #000a; touch-action:pan-y; }
#iconsBox h2 { margin:0 44px 4px 0; font-size:19px; }
#iconsBox p { margin:0 0 10px; font-size:13px; color:#aaa; line-height:1.4; }
.irow { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid #34373d; }
.irow .pv { width:52px; height:52px; flex:none; border-radius:8px; background:#7d838c;
            display:flex; align-items:center; justify-content:center; overflow:hidden; }
.irow .pv img { max-width:46px; max-height:46px; }
.irow .pv span { color:#e6e6e6; font-size:10px; text-align:center; line-height:1.1; word-break:break-word; padding:2px; }
.irow .nm { flex:1; font-size:15px; }
.irow button { border:0; border-radius:9px; padding:10px 12px; font-size:14px; background:#3a3e45; color:#fff; }
.irow button.pick { background:#2f5d8a; }
/* ---- settings window ---- */
#settings { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
            background:rgba(0,0,0,.55); touch-action:pan-y; }
#settings.show { display:flex; }
#setBox { position:relative; background:#1e2024; color:#eee; border-radius:14px; width:min(480px,96vw);
          max-height:92vh; overflow:auto; padding:14px 16px 8px; box-shadow:0 8px 30px #000a; touch-action:pan-y; }
#setBox h2 { margin:0 44px 6px 0; font-size:19px; }
.sgrp { padding:12px 0; border-top:1px solid #34373d; }
.sgrp h3 { margin:0 0 8px; font-size:14px; color:#aaa; font-weight:700; }
.seg { display:flex; gap:3px; padding:3px; background:#2a2d33; border-radius:11px; }
.seg button { flex:1 1 0; min-width:0; border:0; border-radius:8px; padding:10px 6px; background:transparent;
              color:#ccc; font:inherit; font-size:15px; }
.seg button.on { background:#2f5d8a; color:#fff; font-weight:700; }
.seg button small { display:block; margin-top:3px; font-size:12.5px; font-weight:400; opacity:.75; }
.sdesc { margin:7px 2px 0; font-size:12.5px; color:#8c9098; line-height:1.4; }
.icoRow { display:flex; align-items:center; gap:10px; }
.icoStrip { flex:1; display:flex; gap:6px; flex-wrap:wrap; }
.icoStrip .ic { position:relative; width:42px; height:42px; border-radius:8px; background:#7d838c;
                display:flex; align-items:center; justify-content:center; overflow:hidden; }
.icoStrip .ic img { max-width:34px; max-height:34px; }
.icoStrip .ic.cus::after { content:""; position:absolute; right:3px; top:3px; width:7px; height:7px;
                           border-radius:50%; background:#5fd17a; box-shadow:0 0 0 1.5px #1e2024; }
.icoRow > button { flex:none; border:0; border-radius:9px; padding:10px 14px; font-size:14px; background:#2f5d8a; color:#fff; }
.skip { font-size:12px; color:#e0a0a0; margin-top:6px; line-height:1.35; }
</style>
</head>

function layoutTokens() {
  for (const name in tokEls) {
    const T = tokEls[name], rc = labelEls[name].rect, p = T.p;
    const rowW = NUMR*2 + GAP + T.n*SYM + (T.n-1)*GAP + (pMode() ? 0 : GAP + HEXW);
    let x = rc.x + rc.w/2 - rowW/2;
    const cy = rc.y - 14;

    x += NUMR*2 + GAP;
    const symX0 = x;

function layoutLabels() {
  const items = [];
  for (const name in labelEls) {
    const { t, p } = labelEls[name];
    const bb = t.getBBox();
    const w = Math.max(bb.width + 2*PADX, p.lw + 8);
    const h = Math.max(bb.height + 2*PADY, p.lh + 8);
    let cx = p.lx + p.lw/2 + (LABEL_SHIFT[name] || 0), cy = p.ly + p.lh/2;
    items.push({ name, w, h, cx, cy, ox:cx, oy:cy });
  }
  const fit = it => {
    it.cx = Math.min(Math.max(it.cx, it.w/2 + 5), W - it.w/2 - 5);
    it.cy = Math.min(Math.max(it.cy, it.h/2 + 5), H - it.h/2 - 5);
    it.cx = Math.min(Math.max(it.cx, it.ox - 12), it.ox + 12);
    it.cy = Math.min(Math.max(it.cy, it.oy - 10), it.oy + 10);
  };
  items.forEach(fit);
  for (let iter = 0; iter < 6; iter++) {
    let moved = false;
    for (let i = 0; i < items.length; i++) for (let j = i+1; j < items.length; j++) {
      const a = items[i], b = items[j];
      const ox = (a.w + b.w)/2 - Math.abs(a.cx - b.cx);
      const oy = (a.h + b.h)/2 - Math.abs(a.cy - b.cy);
      if (ox <= 0 || oy <= 0) continue;
      moved = true;
      if (ox < oy) {
        const d = (ox/2 + 0.5) * (a.cx <= b.cx ? -1 : 1);
        a.cx += d; b.cx -= d;
      } else {
        const d = (oy/2 + 0.5) * (a.cy <= b.cy ? -1 : 1);
        a.cy += d; b.cy -= d;
      }
      fit(a); fit(b);
    }
    if (!moved) break;
  }
  for (const it of items) {
    const { erase, box, t, p } = labelEls[it.name];
    const { cx, cy, w, h } = it;
    box.setAttribute("x", cx-w/2); box.setAttribute("y", cy-h/2);
    box.setAttribute("width", w);  box.setAttribute("height", h);
    const ex = Math.min(cx-w/2, p.lx-2), ey = Math.min(cy-h/2, p.ly-2);
    const ew = Math.max(cx+w/2, p.lx+p.lw+2) - ex, eh = Math.max(cy+h/2, p.ly+p.lh+2) - ey;
    erase.setAttribute("x",ex); erase.setAttribute("y",ey);
    erase.setAttribute("width",ew); erase.setAttribute("height",eh);
    t.setAttribute("x", cx); t.setAttribute("y", cy + 0.5);
    labelEls[it.name].rect = { x:cx-w/2, y:cy-h/2, w, h };
  }
  layoutTokens();
}

function render() {
  for (const p of planets) {

    const T = tokEls[p.name];

/* ---------- zoom and pan ---------- */
let scale = 1, tx = 0, ty = 0;
function baseBox() {
  const s = stage.getBoundingClientRect();
  const w = Math.min(s.width, s.height * W / H);
  const h = Math.min(s.height, s.width * H / W);
  return { sw:s.width, sh:s.height, w, h, l:(s.width-w)/2, t:(s.height-h)/2 };
}
function clamp() {
  const b = baseBox();
  const mw = b.w*scale, mh = b.h*scale;
  tx = mw <= b.sw ? (b.sw-mw)/2 - b.l : Math.min(-b.l, Math.max(b.sw - mw - b.l, tx));
  ty = mh <= b.sh ? (b.sh-mh)/2 - b.t : Math.min(-b.t, Math.max(b.sh - mh - b.t, ty));
}
function apply() {
  clamp();

}
function zoomAt(cx, cy, factor) {
  const b = baseBox();
  const ns = Math.min(6, Math.max(1, scale*factor));
  const k = ns/scale;
  tx = cx - b.l - k*(cx - b.l - tx);
  ty = cy - b.t - k*(cy - b.t - ty);
  scale = ns;
  apply();
}
function zoomCentre(factor) { const b = baseBox(); zoomAt(b.sw/2, b.sh/2, factor); }
document.getElementById("zoomIn").addEventListener("click", () => zoomCentre(1.5));
document.getElementById("zoomOut").addEventListener("click", () => zoomCentre(1/1.5));

/* ---------- hit testing ---------- */
function toMap(clientX, clientY) {
  const r = mapEl.getBoundingClientRect();
  return { x:(clientX - r.left) * W / r.width, y:(clientY - r.top) * H / r.height };
}
const inRect = (q, r) => r && q.x >= r.x && q.x <= r.x + r.w && q.y >= r.y && q.y <= r.y + r.h;

    if ((yi > q.y) !== (yj > q.y) && q.x < (xj - xi) * (q.y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function handleTap(clientX, clientY) {
  const q = toMap(clientX, clientY);

  for (const name in tokEls) {
    const T = tokEls[name];
    if (inRect(q, T.hit.hex)) { cycleFaction(name); return; }
  }
  for (const name in tokEls) {
    const T = tokEls[name];
    if (inRect(q, T.hit.sym)) { st.sab[name] = !st.sab[name]; changed(); return; }
  }
  if (altCtrl) { const p = planetAt(q); if (p) toggleCross(p); return; }
  if (pMode()) for (const name in plEls) {
    const p = tokEls[name].p;
    if (Math.hypot(q.x - p.x, q.y - p.y) <= plEls[name].R + 4) { cycleFaction(name); return; }
  }
  /* enemy troops are set by a long press on the system area (see pressTarget) */
}
/* what a long press does: cross on the planet, enemy troops on the rest of the system */
/* planet under the point: its name label or the planet disc */
function planetAt(q) {
  for (const p of planets) if (inRect(q, labelEls[p.name].rect)) return p;
  for (const p of planets)
    if (Math.hypot(q.x - p.x, q.y - p.y) <= (REGIONS[p.name].r || 30) + 6) return p;
  return null;
}
function toggleCross(p) {
  if (!crossOn) { flashHint(STR[lang].needCross, 3500); if (navigator.vibrate) navigator.vibrate(15); return; }
  if (p.name === LOCKED) return;                 /* Coruscant keeps its cross */
  marks[p.name] = !marks[p.name];

function pressTarget(clientX, clientY) {

      if (inRect(q, T.hit.hex) || inRect(q, T.hit.sym)) { p = T.p; break; }
    }

/* ---------- gestures ---------- */
const pts = new Map();

  if (e.pointerType === "mouse" && e.button !== 0) return;

  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pts.size === 1) restoreTap = needsRestore();
  if (pts.size === 2) {
    cancelPress(); panning = false; tapOk = false;
    const [a,b] = [...pts.values()];
    pinchDist = Math.hypot(a.x-b.x, a.y-b.y);
    pinchMid  = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    return;
  }
  startX = e.clientX; startY = e.clientY; panning = true; tapOk = !restoreTap;
  if (restoreTap) return;               /* this touch only brings fullscreen back */
  const tg = pressTarget(e.clientX, e.clientY);
  if (!tg) return;
  cancelPress();
  pressTimer = setTimeout(() => {
    pressTimer = null; tapOk = false; panning = false;
    if (tg.pick) {
      if (tg.pick.name === LOCKED) { if (navigator.vibrate) navigator.vibrate(15); return; }   /* always Imperial */
      showPicker(tg.pick.name, startX, startY);
      if (navigator.vibrate) navigator.vibrate(35);
      return;
    }
    if (tg.empty || (tg.cross && !crossOn)) {     /* explain instead of silence */
      const need = altCtrl ? "needFacA" : pMode() ? "needFacP" : "needFac";
      flashHint(tg.empty ? STR[lang][need] : STR[lang].needCross, tg.empty ? 2500 : 3500);
      if (navigator.vibrate) navigator.vibrate(15);
      return;
    }
    if (tg.enemy) {
      st.enemy[tg.enemy] = !st.enemy[tg.enemy];
    } else {
      if (tg.cross.name === LOCKED) return;      /* Coruscant keeps its cross */
      marks[tg.cross.name] = !marks[tg.cross.name];

});

  if (!pts.has(e.pointerId)) return;

  if (pts.size === 2) {
    const [a,b] = [...pts.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);

              : `<rect x="2" y="2" width="16" height="16" rx="2.5"/>`;

}
function calcProduction() {
  const t = STR[lang];

                      src:[[],[],[]], skip:[] });
  const R = mk(), E = mk();

    for (const s of syms) res.q[queue-1][s]++;

  add(R, REBEL_BASE[0], REBEL_BASE[1], t.base);
  for (const p of planets) {
    const info = PROD[p.name];

    if (why.length) { res.skip.push(`${label(p)} (${why.join(", ")})`); continue; }
    const syms = f === OCC ? info[1].slice(0, 1) : info[1];

function processIcon(file, slot) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const M = 200, k = Math.min(1, M / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, w, h);

    const corners = [at(0,0), at(w-1,0), at(0,h-1), at(w-1,h-1)];
    const bg = [0,1,2].map(c => corners.reduce((s, i) => s + px[i+c], 0) / 4);
    const diff = i => Math.abs(px[i]-bg[0]) + Math.abs(px[i+1]-bg[1]) + Math.abs(px[i+2]-bg[2]);
    if (Math.max(...corners.map(diff)) < 90) {
      const TOL = 70, seen = new Uint8Array(w*h), stack = [];
      for (let x = 0; x < w; x++) stack.push(x, 0, x, h-1);
      for (let y = 0; y < h; y++) stack.push(0, y, w-1, y);
      while (stack.length) {
        const y = stack.pop(), x = stack.pop();
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        const n = y*w + x; if (seen[n]) continue; seen[n] = 1;
        const i = n*4; if (diff(i) > TOL) continue;
        px[i+3] = 0;
        stack.push(x+1, y, x-1, y, x, y+1, x, y-1);
      }
      cx.putImageData(d, 0, 0);
    }
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (px[at(x,y)+3] > 20) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    let out = cv;
    if (x1 >= x0 && (x1-x0+1 < w || y1-y0+1 < h)) {
      out = document.createElement("canvas"); out.width = x1-x0+1; out.height = y1-y0+1;

  };

}

<h3>Належність</h3><ul>

<li>Кольори планет: <b>чорна</b> — Імперія, <b>біла</b> — Повстанці, <b>сіра</b> — окупована, без змін — нічия.</li>
<li>Зручніше старий шестикутник біля назви? Меню → <b>Налаштування</b> → <b>Як показувати належність: Шестикутник</b>; тоді тапати треба по шестикутнику.</li></ul>
<h3>Пошук бази</h3><ul>
<li><b>Довге натискання на планету</b> — закреслити (бази там немає). Ще раз — прибрати хрестик.</li>
<li>Корусант завжди імперський і завжди закреслений.</li>
<li>Меню → <b>Приховати і викл. ❌</b> ховає всі хрестики й вимикає довге натискання на планети (ворожі війська працюють як і раніше). Хрестики не стираються; меню → <b>Показати і вкл. ❌</b> повертає їх.</li></ul>
<h3>Виробництво</h3><ul>
<li><b>Тап по символах виробництва</b> під планетою — диверсія; ще раз — прибрати.</li>
<li><b>Довге натискання на порожню область системи</b> — ворожі війська (спершу задайте належність).</li>
<li>Система з диверсією або ворожими військами нічого не виробляє.</li>
<li>Меню → <b>Порахувати виробництво</b> показує юніти кожної сторони за чергами. Окупована система дає лише перший символ; база повстанців враховується завжди.</li></ul>
<h3>Альтернативне керування</h3><ul>
<li>Меню → <b>Налаштування</b> → <b>Керування</b> перемикає дві схеми. Класична (описана вище): тап по планеті — належність, довге натискання — хрестик.</li>
<li>Альтернативна: <b>тап по планеті</b> — поставити або прибрати хрестик; <b>довге натискання на планету</b> — меню для прямого вибору належності.</li>
<li>Диверсія та ворожі війська працюють однаково в обох схемах.</li></ul>
<h3>Карта й налаштування</h3><ul>
<li><b>Двома пальцями</b> або <b>+ / −</b> — масштаб, тягнути — рух.</li>
<li>Меню → <b>Налаштування</b>: як показувати належність, керування, мова (English / Українська) і <b>свої значки</b> — власні картинки для належності й кораблів (кнопка <b>Змінити</b>).</li>
<li><b>Очистити карту</b> — нова гра. Усе зберігається автоматично лише на цьому пристрої.</li></ul>
<p class="fine">Неофіційний фанатський інструмент, не пов'язаний з Fantasy Flight Games чи Lucasfilm.</p>`
};
const aboutEl = document.getElementById("about");
function showAbout() { document.getElementById("aboutBody").innerHTML = ABOUT[lang]; aboutEl.classList.add("show"); }
function hideAbout() { aboutEl.classList.remove("show"); }
document.getElementById("aboutBtn").addEventListener("click", () => { setMenu(false); showAbout(); });
document.getElementById("aboutClose").addEventListener("click", hideAbout);
aboutEl.addEventListener("click", e => { if (e.target === aboutEl) hideAbout(); });

/* ---------- menu ---------- */
const menuBtn = document.getElementById("menuButton");
function setMenu(open) {
  menu.classList.toggle("show", open);
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
document.addEventListener("pointerdown", e => {
  if (!menu.classList.contains("show")) return;
  if (menu.contains(e.target) || menuBtn.contains(e.target)) return;
  setMenu(false);
}, true);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (iconsEl.classList.contains("show")) { hideIcons(); return; }   /* back to settings */
  hidePicker(); setMenu(false); hideProduction(); hideSettings(); hideAbout();
});
menuBtn.addEventListener("click", () => setMenu(!menu.classList.contains("show")));

const fsBtn = document.getElementById("fsBtn");
function syncFs() { fsBtn.textContent = isFullscreen() ? STR[lang].fsExit : STR[lang].fsEnter; }
fsBtn.addEventListener("click", async () => {
  try {
    if (isFullscreen()) {
      setWantFs(false);
      await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
    } else {
      setWantFs(true);
      enterFs();
    }
  } catch(e) {}
  syncFs(); setMenu(false);
});
document.getElementById("clear").addEventListener("click", () => {
  if (confirm(STR[lang].confirmClear)) {
    marks = {}; st = { fac:{}, sab:{}, enemy:{} };
    normalise(); save(); render(); setMenu(false);
  }
});
document.getElementById("exit").addEventListener("click", () => {
  save(); setMenu(false);
  try {
    if (window.AndroidApp && AndroidApp.exit) AndroidApp.exit();
    else window.close();
  } catch(e) {}
  hint.textContent = STR[lang].saved;
  hint.classList.remove("hide");
  setTimeout(() => hint.classList.add("hide"), 3000);
});
setTimeout(() => hint.classList.add("hide"), 7000);

for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) {
  document.addEventListener(ev, () => {
    syncFs();
    if (isFullscreen()) {
      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); } catch(e) {}
    }
  });
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutLabels);
applyLang(); render(); apply();
</script>
